services:
  # Backend: REST API + background workers. Must stay a single process (state is in memory).
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "${API_HOST_PORT:-8100}:8000"   # http://localhost:8100/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Frontend: Streamlit UI, talks to the API over the compose network.
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"   # http://localhost:8501
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
